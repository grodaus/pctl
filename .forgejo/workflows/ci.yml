name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

jobs:
  # Pure + in-process tests. Runs in the Nix sandbox — no systemd --user access.
  # e2e (test/e2e/, alias `e2e`) is deliberately excluded here; it requires a
  # real user session and runs on the dev host / a privileged runner.
  check:
    runs-on: nix
    steps:
      - name: Checkout
        run: |
          git clone --no-progress "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git" .
          git fetch --no-progress origin "${GITHUB_SHA}"
          git checkout "${GITHUB_SHA}"

      - name: nix flake check
        run: nix flake check

      - name: Build binary
        run: nix build .#default

  # e2e layer — requires systemd --user. Needs a runner with a user session.
  # Kept separate so check/ stays sandbox-safe.
  e2e:
    runs-on: nix-privileged
    needs: check
    steps:
      - name: Checkout
        run: |
          git clone --no-progress "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git" .
          git fetch --no-progress origin "${GITHUB_SHA}"
          git checkout "${GITHUB_SHA}"

      - name: Run e2e suite
        run: nix develop .#ci --command dune runtest --force --alias e2e
